# Prepares a GitHub release whenever a version tag (v1.2.3) is pushed:
# builds the mod, runs the tests and attaches the JAR to a new draft release.
# The draft is published by hand on GitHub, once the release notes are written.

name: release
on:
  push:
    tags: ['v*']

# Needed to create the release
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: check that the tag matches the version in gradle.properties
        run: |
          version=$(grep '^version=' gradle.properties | cut -d= -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version=$version in gradle.properties"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        # A draft is only visible to the maintainers: nobody is notified and "latest release" does not change
        # until it is published. The generated notes (pull requests since the previous tag) are a starting point.
        run: >
          gh release create "$GITHUB_REF_NAME"
          "build/libs/timed-hardcore-$VERSION.jar"
          --title "$GITHUB_REF_NAME"
          --generate-notes
          --verify-tag
          --draft
